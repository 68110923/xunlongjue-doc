name: 🐛 Bug report
description: 报告使用中遇到的问题
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认这不是“仅供研究、不构成投资建议”的范围，以及不是环境/数据源配置问题。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: xlp 版本或最近一次 git 提交
      placeholder: "例如 v1.0 / 4174380"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 安装 / 部署
        - 数据采集
        - 选票 / 策略
        - 复盘 / 明日观察
        - 网页看板
        - 推送
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出可重复的命令、日期和输入
      placeholder: |
        1. xlp ...
        2. xlp ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 日志
      description: 请删除 Key、路径中的用户名和任何个人信息
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 issue
          required: true
        - label: 日志中已移除 API Key 和个人信息
          required: true
